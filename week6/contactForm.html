<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Form Firebase</title>

<style>
body{
    font-family: Arial;
    background:#f4f6f9;
    padding:30px;
}
.container{
    width:400px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}
input, textarea{
    width:95%;
    padding:10px;
    margin:8px 0;
}
button{
    padding:10px;
    width:100%;
    margin-top:10px;
    cursor:pointer;
}
.success{
    color:green;
    margin-top:10px;
}
</style>

</head>

<body>

<div class="container">

<h2>Contact Us</h2>

<input type="text" id="fname" placeholder="First Name">
<input type="text" id="lname" placeholder="Last Name">
<input type="text" id="phone" placeholder="Phone Number">
<input type="email" id="email" placeholder="Email">
<textarea id="message" placeholder="Your Message"></textarea>

<button onclick="saveInfo()">Submit</button>
<button onclick="readInfo()">View in Console</button>

<div class="success" id="msg"></div>

</div>

<script type="module" src="contactForm.js"></script>

</body>
</html>
