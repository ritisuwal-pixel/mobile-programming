<!DOCTYPE html>
<html>
    <head>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js" >
        </script>
        <script>
            $(document).ready(function(){
                $('#bttn').click(function(){
                    var box= $('#box');
                    box.animate({left:'1150px', top: '0px'},1000,function(){
                        $(this).css('background-color','blue');})
                    
                    box.animate({left:'1150px', top:'430px'},1000,function(){
                        $(this).css('background-color','yellow');})
                    
                    box.animate({left:'0px',top:'430px'},1000,function(){
                        $(this).css('background-color','red');})
                    
                    box.animate({left: '0px', top:'0px'},1000,function(){
                        $(this).css('background-color','pink');})
                });
            });
        </script>
        <style>
            #box {
                padding: 10px;
                height: 100px;
                width: 100px;
                background-color: pink;
                position: absolute;
                top: 0px;
                left: 0px;
            }

            #bttn {
                margin-top: 250px;
                margin-left: 550px;
            }
        </style>
    </head>
    <body>
        <div id="box"></div>
        <button id="bttn">Click to start Animation</button>

    </body>
</html>
