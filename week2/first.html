<!DOCTYPE html>
<html>
<head>
  <title>10 Div Uses</title>
</head>
<body>

<!-- 1. Normal div -->
<div>Normal div</div>

<!-- 2. Styled div -->
<div style="color: red;">Styled div</div>

<!-- 3. Background color div -->
<div style="background-color: lightblue;">Background div</div>

<!-- 4. Div with border -->
<div style="border: 1px solid black;">Border div</div>

<!-- 5. Div with padding -->
<div style="padding: 10px;">Padding div</div>

<!-- 6. Div with margin -->
<div style="margin: 10px;">Margin div</div>

<!-- 7. Div with text alignment -->
<div style="text-align: center;">Centered text</div>

<!-- 8. Clickable div -->
<div onclick="alert('Clicked!')">Clickable div</div>

<!-- 9. Hidden div -->
<div style="display: none;">Hidden div</div>

<!-- 10. Div updated by JavaScript -->
<div id="jsDiv">JS div</div>

<script>
  document.getElementById("jsDiv").innerText = "Changed by JavaScript";
</script>

</body>
</html>
