<!DOCTYPE html>
<html>
    <head>
        <title>Student Result Calculator</title>
    
    </head>
    <body>
        <h2>Student Result Calculator</h2>

        <p>Enter the marks obtained in the following subjects:</p>

        <form id = "resultForm">
        
        Maths: <input type="number" id="s1" placeholder="Maths"><br><br>
        Science: <input type="number" id="s2" placeholder="Science"><br><br>
        Computer: <input type="number" id="s3" placeholder="Computer"><br><br>
        Economics: <input type="number" id="s4" placeholder="Economics"><br><br>
        Accounts: <input type="number" id="s5" placeholder="Accounts"><br><br>
        English: <input type="number" id="s6" placeholder="English"><br><br>
        Nepali: <input type="number" id="s7" placeholder="Nepali"><br><br>
        Social: <input type="number" id="s8" placeholder="Social"><br><br>

        <button type="button" onclick="calculateResult()">Calculate Result</button>
        </form>
        <h3 id="total"></h3>
        <h3 id="result"></h3>

        <script src="script.js"></script>
    </body>
</html>
